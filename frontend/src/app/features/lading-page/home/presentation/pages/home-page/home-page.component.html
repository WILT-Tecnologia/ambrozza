<main class="w-full m-0 p-0">
  <app-hero></app-hero>

  <app-infoCards></app-infoCards>

  @if (featuredProducts.length >= 4) {
  <app-highlights [items]="featuredProductCards" />
  }

  @if (bestSellingProducts.length >= 6) {
  <app-best-sellers [products]="bestSellingProducts" />
  }

  @if (!hasHomeProductSections) {
  <section class="w-full bg-transparent pt-4 pb-16">
    <div class="container-padrao">
      <app-empty-products message="Sua loja ainda não possui produtos suficientes para mostrar." />
    </div>
  </section>
  }

  <app-categories-home></app-categories-home>

  <app-evaluations-home></app-evaluations-home>

  <app-cta-banner></app-cta-banner>
</main>
