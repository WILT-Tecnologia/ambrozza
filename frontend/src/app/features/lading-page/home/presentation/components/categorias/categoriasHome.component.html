<section class="w-full bg-(--bg-footer) pt-12 pb-16 px-4 sm:px-6 lg:px-8">
  <div class="container-padrao">

    <div class="mb-8">
      <span class="text-xs uppercase tracking-widest text-(--text-muted) font-semibold block mb-1">
        Para cada ocasião
      </span>
      <h2 class="font-serif text-3xl sm:text-4xl font-bold text-(--text-main)">
        Categorias
      </h2>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-4">

      @for (categoria of categorias; track categoria.id) {
      <a [routerLink]="['/cardapio']" [queryParams]="{ categoria: categoria.filtro }"
        class="bg-(--bg-card) rounded-3xl p-5 border border-(--border-color) flex flex-col items-center justify-center text-center transition-all duration-300 ease-out hover:scale-[1.03] hover:border-(--primary) hover:shadow-md group cursor-pointer">

        <div
          class="w-16 h-16 sm:w-20 sm:h-20 rounded-full overflow-hidden shrink-0 bg-(--bg-surface) border-2 border-(--border-color) group-hover:border-(--primary) transition-colors mb-3">
          <img [src]="categoria.imagem" [alt]="categoria.nome"
            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
        </div>

        <h3
          class="font-serif font-bold text-(--text-main) text-sm sm:text-base group-hover:text-(--primary) transition-colors leading-tight">
          {{ categoria.nome }}
        </h3>

      </a>
      }

    </div>

  </div>
</section>
