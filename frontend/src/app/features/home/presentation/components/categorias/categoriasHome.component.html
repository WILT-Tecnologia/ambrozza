<section class="w-full bg-[#FEF3E9] pt-12 pb-16 px-4 sm:px-6 lg:px-8">
  <div class="max-w-7xl mx-auto">

    <!-- Cabeçalho da Seção -->
    <div class="mb-8">
      <span class="text-xs uppercase tracking-widest text-[#8C7A70] font-semibold block mb-1">
        Para cada ocasião
      </span>
      <h2 class="font-serif text-3xl sm:text-4xl font-bold text-[#3E2A22]">
        Categorias
      </h2>
    </div>

    <!-- Grid com 7 colunas no desktop -->
    <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-4">

      @for (categoria of categorias; track categoria.id) {
      <a [routerLink]="['/cardapio']" [queryParams]="{ categoria: categoria.filtro }"
        class="bg-white rounded-3xl p-5 border border-[#E6DDD3] flex flex-col items-center justify-center text-center transition-all duration-300 ease-out hover:scale-[1.03] hover:border-[#E28597] hover:shadow-md group cursor-pointer">

        <!-- Imagem Circular -->
        <div
          class="w-16 h-16 sm:w-20 sm:h-20 rounded-full overflow-hidden shrink-0 bg-[#F2ECE4] border-2 border-[#E6DDD3] group-hover:border-[#E28597] transition-colors mb-3">
          <img [src]="categoria.imagem" [alt]="categoria.nome"
            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
        </div>

        <!-- Nome da Categoria -->
        <h3
          class="font-serif font-bold text-[#3E2A22] text-sm sm:text-base group-hover:text-[#E28597] transition-colors leading-tight">
          {{ categoria.nome }}
        </h3>

      </a>
      }

    </div>

  </div>
</section>
