<main class="fixed inset-0 z-50 flex items-center justify-center overflow-hidden bg-[#faf9f7]">
  <style>
    @keyframes intro {
      0% {
        opacity: 0;
        transform: scale(0.75);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes textFade {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes progress {
      0% {
        width: 0%;
      }

      100% {
        width: 100%;
      }
    }

    .intro-animation {
      animation: intro 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .text-animation {
      animation: textFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    .progress-animation {
      animation: progress 3.5s linear forwards;
    }
  </style>

  <div class="flex w-full max-w-md flex-col items-center justify-center px-6 intro-animation">
    <div class="flex h-60 w-60 items-center justify-center rounded-full bg-[#eeeeee] sm:h-64 sm:w-64">
      <ng-lottie [options]="{
          path: '/animations/pinkcake.json',
          renderer: 'svg',
          loop: true,
          autoplay: true
        }" class="h-64 w-64 sm:h-60 sm:w-60"></ng-lottie>
    </div>

    <p class="mt-8 text-center text-[15px] tracking-[0.01em] text-[#777] opacity-0 text-animation">
      Estamos preparando tudo para você...
    </p>

    <div class="mt-7 h-1 w-full overflow-hidden rounded-full bg-[#e5e5e5]">
      <div class="h-full rounded-full bg-[#7B3306] progress-animation"></div>
    </div>
  </div>
</main>
