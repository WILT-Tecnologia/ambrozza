services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ambrozza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ambrozza}
      POSTGRES_DB: ${POSTGRES_DB:-ambrozza}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ambrozza} -d ${POSTGRES_DB:-ambrozza}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ambrozza}:${POSTGRES_PASSWORD:-ambrozza}@postgres:5432/${POSTGRES_DB:-ambrozza}?schema=public
      PORT: 3000
      CORS_ORIGIN: http://localhost:4200
      CHOKIDAR_USEPOLLING: "true"
      TSC_WATCHFILE: PriorityPollingInterval
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_prisma_generated:/app/generated
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npm run start:dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
    ports:
      - "4200:4200"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  backend_node_modules:
  backend_prisma_generated:
  frontend_node_modules:
